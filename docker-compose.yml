services:
  vc-creative:
    image: itzg/minecraft-server:latest
    container_name: vc-creative
    tty: true
    stdin_open: true
    ports:
      - "30000:25563"
      - "24453:24453/udp"
    environment:
      EULA: true
      TYPE: PAPER
      VERSION: 26.3
      MAX_PLAYERS: 64
      MOTD: "You shouldn't see this"
      USE_AIKAR_FLAGS: true
      INIT_MEMORY: 1G
      MEMORY: 6G
      LEVEL: "creative"
      SERVER: "creative"
      WORLD_NAME: "plots"
      DIFFICULTY: "1"
      LEVEL_TYPE: "flat"
      GENERATOR_SETTINGS: >-
        {"biome":"minecraft:plains","layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":62},{"block":"minecraft:grass_block","height":1}]}
      GENERATE_STRUCTURES: "false"
      MODRINTH_PROJECTS: |
        axiom-paper-plugin
        luckperms
        multiverse-core
        packetevents
        placeholderapi
        tab-was-taken
        worldedit
        worldguard
    volumes:
      - "./schematics:/data/plugins/WorldEdit/schematics:z"
      - "./server:/data"